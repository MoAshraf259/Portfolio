services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://portfolio_user:portfolio_pass@postgres:5432/portfolio?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-mohamed.ashraf13998@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Cross98@}
      JWT_SECRET: ${JWT_SECRET:-60cbd0f9e9e45eb6cf106b03b01c8bbf83fdba104270b918b26a0950f9c3f7079ce461ec474fc5d6337e0104be60290b}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    depends_on:
      - postgres
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
